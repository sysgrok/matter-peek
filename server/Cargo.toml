[package]
name = "matter-peek-server"
description = "The matter-peek API over WebSocket/JSON, and its clients' connection"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The controller, run on this host; `ble`: commissioning over Bluetooth LE
# (Linux + BlueZ).
matter-peek-core = { path = "../core", features = ["ble"] }

serde_json = { workspace = true }
async-net = { workspace = true }
async-channel = { workspace = true }
async-tungstenite = { workspace = true }
async-executor = { workspace = true }
futures-lite = { workspace = true }
futures-util = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
# The assistant: the model's API over HTTP(S) (blocking calls, on the thread
# pool), its chats kept as JSON, and the wait for an approval.
ureq = "3.5"
blocking = "1"
serde = { workspace = true, features = ["derive", "std"] }
async-io = { workspace = true }
