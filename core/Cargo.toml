[package]
name = "matter-peek-core"
description = "Vendor-agnostic Matter diagnostic controller core (wraps rs-matter)"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true

[features]
# Default is the hosted/desktop build (Avahi backend → `std`). An embedded
# target builds with `--no-default-features` and selects an embedded-appropriate
# backend (BuiltinMdns, or a future esp one) + `rs-matter`'s no-os crypto/rng.
default = ["mdns-avahi"]

# `std`: enable rs-matter's hosted (`os`) path. Pulled in by every std mDNS
# backend below; an embedded build leaves it off so `core` stays `no_std`.
std = ["rs-matter/os"]

# mDNS backend selection. Pick exactly one. OS-native daemons (preferred) need
# `std`; `mdns-builtin` is a same-host-test/fallback responder (also `std`).
mdns-avahi = ["std", "rs-matter/zbus"]                                # Linux + Avahi
mdns-resolve = ["std", "rs-matter/zbus"]                              # Linux + systemd-resolved
mdns-astro = ["std", "rs-matter/astro-dnssd"]                         # macOS / iOS (Bonjour)
mdns-builtin = ["std", "dep:socket2", "dep:nix", "dep:async-io"]     # fallback / Windows / same-host tests

# BLE commissioning (Commissioner over BTP/GATT Central). Linux + BlueZ over
# D-Bus, via rs-matter's `zbus` feature (the same one Avahi uses, so no new
# heavy dependency). Enables the `commission_ble` flow.
ble = ["std", "rs-matter/zbus"]

[dependencies]
# `core` is `no_std` + `alloc` (portable to esp32 etc.). It depends on rs-matter
# with NO default features (rs-matter's `os` ⇒ `std`); the hosted `os` path is
# re-enabled only via this crate's `std` feature. mDNS backends and raw sockets
# are likewise feature-gated.
# Depend on the released crates.io version (default-features off). Keeping it a
# plain registry dep — rather than a git/path dep here — is what lets a
# `[patch.crates-io]` in the workspace root redirect every crate uniformly to a
# local clone during co-development with rs-matter.
rs-matter = { version = "0.4", default-features = false, features = ["alloc", "rustcrypto", "log"] }
log = { workspace = true }
embassy-futures = { workspace = true }
embassy-time = { version = "0.5", default-features = false }
# mDNS builtin backend only (std): raw multicast socket + interface enum + async-io.
async-io = { workspace = true, optional = true }
socket2 = { workspace = true, optional = true }
nix = { workspace = true, optional = true }
