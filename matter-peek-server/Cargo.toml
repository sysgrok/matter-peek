[package]
name = "matter-peek-server"
description = "The matter-peek server: a controller and its assistant for the connections to them, and the API over WebSocket/JSON with the web UI, on one port"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
build = "build.rs"
include = ["/src", "/build.rs", "/web-dist", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
# The API and its controller, whose tasks run on several threads (`send-sync`);
# the executable picks the mDNS backend.
matter-peek-core = { version = "0.1.0", path = "../matter-peek-core", default-features = false, features = ["std", "send-sync"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
log = { workspace = true }
# The executor of the server and its connections (smol family), and the
# assistant's model calls on a thread pool.
async-executor = { workspace = true }
async-io = { workspace = true }
async-channel = { workspace = true }
blocking = "1"
futures-lite = { workspace = true }
futures-util = { workspace = true }
# The API over WebSocket, and the web UI over HTTP, on one port.
async-net = { workspace = true }
async-tungstenite = { workspace = true }
# The assistant's model, over HTTPS (rustls, with its own root certificates).
ureq = "3.5"
# The web UI's files are kept gzipped; a client that takes no gzip gets them
# unpacked.
flate2 = "1"
# The API's access token, and the salts of the store's files.
rand = { workspace = true }
# The store's files: base64 on the wire, and sealed with a passphrase (rustls
# already brings ring).
base64 = "0.22"
ring = "0.17"

[build-dependencies]
# The web UI's files, gzipped into the library.
flate2 = "1"
