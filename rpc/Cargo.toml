[package]
name = "matter-peek-rpc"
description = "Local WebSocket/JSON RPC server exposing matter-peek-core to UIs"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "matter-peek-server"
path = "src/main.rs"

[dependencies]
# `ble`: commissioning over Bluetooth LE (Linux + BlueZ).
matter-peek-core = { path = "../core", features = ["ble"] }
matter-peek-proto = { path = "../proto" }
rs-matter = { workspace = true, features = ["qr-scan"] }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
async-net = { workspace = true }
async-channel = { workspace = true }
async-tungstenite = { workspace = true }
async-executor = { workspace = true }
async-io = { workspace = true }
futures-lite = { workspace = true }
futures-util = { workspace = true }
embassy-futures = { workspace = true }
embassy-time = { workspace = true }
embassy-time-queue-utils = { workspace = true }
rand = { workspace = true }
static_cell = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
# Platform-standard data dir for the persistence store (~/.local/share on Linux,
# ~/Library/Application Support on macOS) instead of a volatile /tmp path.
directories = "6"
# OTA image uploads arrive base64-encoded over the WebSocket.
base64 = "0.22"
# Picture -> pixels, for reading QR codes; rs-matter does the recognition.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
