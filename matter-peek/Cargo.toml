[package]
name = "matter-peek"
description = "A Matter controller for diagnostics, in one executable: the server with its web UI, the command line, and MCP tools for AI agents"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = true
license.workspace = true
# The project's README, the crate's page on crates.io.
readme = "../README.md"
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "matter-peek"
path = "src/main.rs"

[dependencies]
# The API, its controller (with Avahi's mDNS, and BLE) and its messages.
matter-peek-core = { version = "0.1.0", path = "../matter-peek-core", features = ["ble"] }
# `serve`, and a controller in this process: the server, and the web UI.
matter-peek-server = { version = "0.1.0", path = "../matter-peek-server" }
clap = { version = "4", features = ["derive", "env"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
# Logs and OTA images travel base64-encoded.
base64 = "0.22"
log = { workspace = true }
env_logger = { workspace = true }
# The executor of the clients (smol family), and blocking work (stdin/stdout
# of `mcp`, the chat's prompt) on a thread pool.
async-executor = { workspace = true }
async-io = { workspace = true }
async-channel = { workspace = true }
blocking = "1"
futures-lite = { workspace = true }
futures-util = { workspace = true }
# `--server`: the API over WebSocket.
async-net = { workspace = true }
async-tungstenite = { workspace = true }
# `chat`: the model's Markdown in the terminal, and a line editor with history
# for the prompt (rustyline 19 needs Rust 1.95, above the MSRV).
termimad = "0.35"
rustyline = "18"
# `assistant set --api-key`: the key, typed without echo.
rpassword = "7"
