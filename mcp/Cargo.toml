[package]
name = "matter-peek-mcp"
description = "MCP (Model Context Protocol) server exposing the matter-peek API to AI agents"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "matter-peek-mcp"
path = "src/main.rs"
required-features = ["std"]

[features]
# The library (protocol layer) is `no_std` + `alloc` by default. The `std`
# feature adds the stdio binary that wires it to the matter-peek server.
default = ["std"]
std = [
    "dep:matter-peek-server",
    "dep:blocking",
    "dep:futures-lite",
    "dep:env_logger",
    "serde_json/std",
    "serde/std",
    "log/std",
]

[dependencies]
# --- Protocol-layer (no_std + alloc) deps: the MCP envelope + tool mapping. ---
# The MCP *protocol* is transport- and runtime-agnostic and depends only on the
# API's messages (core without the controller) plus serde_json's `alloc` mode.
# No std, so this layer is reusable by a future esp on-device shell.
matter-peek-core = { path = "../core", default-features = false }
# serde + serde_json in `alloc` (no_std) mode; the `std` feature flips them on.
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
log = { version = "0.4", default-features = false }
# OTA image uploads go to the server base64-encoded.
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

# --- std binary glue (behind the `std` feature). ---
# MCP-over-stdio is just JSON-RPC 2.0 over newline-delimited stdin/stdout; the
# binary talks to the matter-peek server through `matter-peek-server`'s client, on
# its smol/async-io runtime. (No tokio-based MCP SDK: it is `Send`-bound, which
# clashes with that single-threaded executor.)
matter-peek-server = { path = "../server", optional = true }
# `blocking::Unblock` async-wraps stdin/stdout via a thread pool — the smol-family
# way to do async stdio (a direct `async_io::Async` over stdin can fail to
# register a pipe/tty fd with epoll).
blocking = { version = "1", optional = true }
futures-lite = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
