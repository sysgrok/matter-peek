[package]
name = "matter-peek-web"
description = "Yew/Wasm web UI for matter-peek (WS/JSON client over the RPC contract)"
version = "0.1.0"
edition = "2021"
authors = ["Ivan Markov <ivan.markov@gmail.com>"]
publish = false
repository = "https://github.com/sysgrok/matter-peek"

# Standalone wasm crate — excluded from the native workspace (see root Cargo.toml).
[workspace]

[dependencies]
matter-peek-proto = { path = "../proto" }

yew = { version = "0.21", features = ["csr"] }
gloo-net = { version = "0.6", features = ["websocket"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
wasm-logger = "0.2"
web-sys = { version = "0.3", features = ["HtmlInputElement"] }
