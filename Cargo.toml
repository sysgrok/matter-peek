[workspace]
resolver = "2"
members = [
    "core",
    "cli",
    "proto",
    "rpc",
    # "uniffi",  # Phase 3 — mobile bindings
    # "web" is a separate wasm crate, excluded from the native workspace build.
]
exclude = ["web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ivan Markov <ivan.markov@gmail.com>"]
publish = false
repository = "https://github.com/sysgrok/matter-peek"
rust-version = "1.84"

[workspace.dependencies]
# rs-matter is the Matter stack we wrap. Pinned to the `im-client-gen` branch, a
# superset of `alloc-tlv`: it carries the peer-address canonicalization /
# IPv6-preferring discovery fixes (#486) and the alloc TLV impls (String / Vec<T> /
# OctetsVec, #487) our persistence uses, PLUS the IM-client codegen that serves
# non-scalar attribute reads (strings/structs/lists) — which lets basic_info /
# diagnostics read in a single round-trip. Move back to `next`/`main` once merged.
rs-matter = { git = "https://github.com/sysgrok/rs-matter", branch = "im-client-gen", default-features = false, features = ["os", "rustcrypto", "log"] }

log = "0.4"
env_logger = "0.11"
embassy-futures = "0.1"
embassy-time = { version = "0.5", features = ["std"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
async-io = "2"
futures-lite = "2"
rand = { version = "0.8", features = ["std", "std_rng"] }
static_cell = "2"

# Phase 1 — RPC server (smol/async-io family, to match the core's runtime).
serde = { version = "1", default-features = false }
serde_json = "1"
async-net = "2"
async-channel = "2"
async-tungstenite = "0.28"
async-executor = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink", "async-await"] }

# mDNS discovery (builtin backend only).
socket2 = { version = "0.5", features = ["all"] }
nix = { version = "0.30", features = ["net"] }

# For local co-development against the working clone, override the git dep with
# a path patch (a git-source patch can't target the same source as the base dep):
# [patch."https://github.com/sysgrok/rs-matter"]
# rs-matter = { path = "../rs-matter/rs-matter" }
