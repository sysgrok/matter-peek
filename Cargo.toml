[workspace]
resolver = "2"
members = [
    "core",
    "cli",
    "proto",
    "rpc",
    "mcp",
    # "uniffi",  # Phase 3 — mobile bindings
    # "web" is a separate wasm crate, excluded from the native workspace build.
]
exclude = ["web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ivan Markov <ivan.markov@gmail.com>"]
publish = false
repository = "https://github.com/sysgrok/matter-peek"
# A recent MSRV (latest stable is 1.96). Comfortably above rs-matter's own 1.87
# and the 1.85 floor that edition-2024 transitive deps (e.g. zeroize) require.
rust-version = "1.92"

[workspace.dependencies]
rs-matter = { version = "0.4", default-features = false, features = ["os", "rustcrypto", "log"] }

log = "0.4"
env_logger = "0.11"
embassy-futures = "0.1"
embassy-time = { version = "0.5", features = ["std"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
async-io = "2"
futures-lite = "2"
rand = { version = "0.10", features = ["std", "std_rng", "thread_rng"] }
static_cell = "2"

# Phase 1 — RPC server (smol/async-io family, to match the core's runtime).
serde = { version = "1", default-features = false }
serde_json = "1"
async-net = "2"
async-channel = "2"
async-tungstenite = "0.28"
async-executor = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink", "async-await"] }

# mDNS discovery (builtin backend only).
socket2 = { version = "0.5", features = ["all"] }
nix = { version = "0.30", features = ["net"] }

# TEMPORARY - remove once these land in a released rs-matter.
#
# Needed for two fixes this crate depends on:
#   * transport: never answer a message that expects no reply (a Status Report,
#     or anything without the MRP R flag) with a `SessionNotFound` - two
#     rs-matter peers otherwise bounce `SessionNotFound` at each other forever,
#     and
#   * `Matter::remove_sessions`, so decommissioning can drop the stale
#     session for the device it just tore down.
[patch.crates-io]
#rs-matter = { path = "../rs-matter/rs-matter" }
rs-matter = { git = "https://github.com/project-chip/rs-matter" }
