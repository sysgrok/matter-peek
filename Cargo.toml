[workspace]
resolver = "2"
members = [
    "matter-peek-core",
    "matter-peek",
    "matter-peek-server",
    "matter-peek-app",
    # "matter-peek-web" is a separate wasm crate, excluded from the native workspace build.
]
# The app (Tauri: WebKitGTK on Linux, the Android SDK for Android) only when asked for.
default-members = ["matter-peek-core", "matter-peek-server", "matter-peek"]
exclude = ["matter-peek-web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ivan Markov <ivan.markov@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sysgrok/matter-peek"
# Ubuntu 24.04's newest Rust (`cargo-1.91`), so it installs with apt's Rust
# too; above rs-matter's own 1.87. CI checks it (the MSRV job).
rust-version = "1.91"

[workspace.dependencies]
rs-matter = { version = "0.4", default-features = false, features = ["os", "rustcrypto", "log"] }

log = "0.4"
env_logger = "0.11"
embassy-futures = "0.1"
embassy-time = { version = "0.5", features = ["std"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
async-io = "2"
futures-lite = "2"
rand = { version = "0.10", features = ["std", "std_rng", "thread_rng"] }
static_cell = "2"

# The server and CLI shells (smol/async-io family, as the core's host).
serde = { version = "1", default-features = false }
serde_json = "1"
async-net = "2"
async-channel = "2"
async-tungstenite = "0.28"
async-executor = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink", "async-await"] }

# mDNS discovery (builtin backend only).
socket2 = { version = "0.5", features = ["all"] }
nix = { version = "0.30", features = ["net"] }

# TEMPORARY - remove once a released rs-matter has what this crate uses from
# `main`: `Transport::browse`, the OTA Provider changes and the Commissioner's
# PASE session reuse. The published crates get no patch, so publishing waits too.
[patch.crates-io]
rs-matter = { git = "https://github.com/project-chip/rs-matter" }
rs-matter-codegen = { git = "https://github.com/project-chip/rs-matter" }

# `--profile dist`: the executable to hand out, as small as it gets without
# slowing the crypto down much (x86_64: 20.3 MB as `release`, 13.0 MB;
# `opt-level = "z"` would save 0.6 MB more).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true
