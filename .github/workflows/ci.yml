name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Nightly run (UTC) to catch breakage from the dependency graph (a new
    # rs-matter point release, or a transitive crate, resolving differently).
    - cron: '50 3 * * *'
  workflow_dispatch:

# Cancel an in-progress run for the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail the build on any rustc/cargo warning, not just clippy lints.
  RUSTFLAGS: -Dwarnings

jobs:
  # Native workspace (matter-peek-core, matter-peek-server, matter-peek), on
  # stable. The default `mdns-avahi` feature pulls rs-matter's `zbus` backend,
  # which is pure-Rust DBus — no system libs needed. The app, which needs
  # WebKitGTK, has a job of its own.
  workspace:
    name: Workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Fmt check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --exclude matter-peek-app --all-targets -- -Dwarnings

      - name: Build
        run: cargo build --workspace --exclude matter-peek-app --all-targets

      - name: Test
        run: cargo test --workspace --exclude matter-peek-app

  # The MSRV (`rust-version`), for both executables: that they build, as the
  # README's `cargo install` does. Lints are the stable jobs'.
  msrv:
    name: MSRV (1.91)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WebKitGTK and D-Bus
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --locked -p matter-peek -p matter-peek-app

  # The app (Tauri), for the desktop: it links the system's WebKitGTK, and
  # D-Bus for its windows. Its formatting is checked with the workspace.
  app:
    name: App (desktop)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WebKitGTK and D-Bus
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -p matter-peek-app --all-targets -- -Dwarnings

      - name: Build
        run: cargo build -p matter-peek-app --all-targets

      - name: Test
        run: cargo test -p matter-peek-app

  # The web UI is a separate wasm crate, excluded from the native workspace, and
  # pinned to nightly + wasm32 via matter-peek-web/rust-toolchain.toml. Build it with trunk.
  web:
    name: Web (wasm)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: matter-peek-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (nightly + wasm32)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: matter-peek-web

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Fmt check
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -Dwarnings

      - name: Build
        run: trunk build
