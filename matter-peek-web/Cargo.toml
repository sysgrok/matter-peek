[package]
name = "matter-peek-web"
description = "Yew/Wasm web UI for matter-peek (a WebSocket/JSON client of the API)"
version = "0.1.0"
edition = "2021"
authors = ["Ivan Markov <ivan.markov@gmail.com>"]
publish = true
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/sysgrok/matter-peek"

# Standalone wasm crate — excluded from the native workspace (see root Cargo.toml).
[workspace]

[dependencies]
# The API's types and messages only, without the controller.
matter-peek-core = { version = "0.1.0", path = "../matter-peek-core", default-features = false }

yew = { version = "0.21", features = ["csr"] }
gloo-net = { version = "0.6", features = ["websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
wasm-logger = "0.2"
web-sys = { version = "0.3", features = [
    "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "FileList", "File",
    # Reading a QR code with the camera.
    "Window", "Navigator", "Document", "MediaDevices", "MediaStream", "MediaStreamConstraints",
    "MediaStreamTrack", "HtmlMediaElement", "HtmlVideoElement", "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    # Copying a pairing code.
    "Clipboard",
    # Remembering the fabric shown, and the server's access token.
    "Storage",
    # Taking the access token out of the page's URL.
    "Location", "History",
    # Light or dark colours.
    "Element", "NodeList", "MediaQueryList",
] }
js-sys = "0.3"
# OTA image uploads: read the picked file, send it base64-encoded.
gloo-file = { version = "0.3", features = ["futures"] }
base64 = "0.22"
# Manual pairing code check digit (as rs-matter does).
verhoeff = { version = "1", default-features = false }
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }

# The release build is what the server serves: as small as it gets.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
