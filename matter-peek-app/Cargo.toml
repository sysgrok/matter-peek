[package]
name = "matter-peek-app"
description = "matter-peek as an app: the web UI in a window, on the core in-process or on a server"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

# The web UI's copy goes into the package although git ignores it.
include = ["/src", "/build.rs", "/tauri.conf.json", "/capabilities", "/icons", "/web-dist"]

# The mobile builds take the library; the desktop one the binary.
[lib]
name = "matter_peek_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `custom-protocol`: the UI served from the executable also when built by
# plain cargo (`cargo install`), not only by `cargo tauri build`.
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-log = "2"
log = { workspace = true }
serde_json = { workspace = true }
async-channel = { workspace = true }
async-executor = { workspace = true }
futures-lite = { workspace = true }

# The core, with the host's mDNS: Avahi on Linux, its own on Android.
[target.'cfg(not(target_os = "android"))'.dependencies]
matter-peek-core = { path = "../matter-peek-core" }

[target.'cfg(target_os = "android")'.dependencies]
matter-peek-core = { path = "../matter-peek-core", default-features = false, features = ["mdns-builtin"] }
