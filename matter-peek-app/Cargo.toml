[package]
name = "matter-peek-app"
description = "matter-peek as an app: the web UI in a window, on the core in-process or on a server"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true

include = ["/src", "/build.rs", "/tauri.conf.json", "/capabilities", "/icons", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

# The mobile builds take the library; the desktop one the binary.
[lib]
name = "matter_peek_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `custom-protocol`: the UI served from the executable also when built by
# plain cargo (`cargo install`), not only by `cargo tauri build`.
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-log = "2"
log = { workspace = true }
serde_json = { workspace = true }
async-channel = { workspace = true }
# Waiting for the core to stop.
async-io = { workspace = true }
# The files the page saves come base64-encoded.
base64 = "0.22"
# The core in the app, with its assistant: a hub of the server's.
matter-peek-server = { version = "0.1.0", path = "../matter-peek-server" }
# The project's page, opened in the browser.
tauri-plugin-opener = "2"

# The core, with each platform's mDNS and, where rs-matter has it, BLE.
# Avahi and BlueZ on Linux (both over D-Bus).
[target.'cfg(target_os = "linux")'.dependencies]
matter-peek-core = { version = "0.1.0", path = "../matter-peek-core", features = ["ble"] }

# Its own on Android: no BLE yet (Android's own commissioning is to do it).
[target.'cfg(target_os = "android")'.dependencies]
matter-peek-core = { version = "0.1.0", path = "../matter-peek-core", default-features = false, features = ["mdns-builtin"] }

# Bonjour on macOS (and iOS).
[target.'cfg(target_vendor = "apple")'.dependencies]
matter-peek-core = { version = "0.1.0", path = "../matter-peek-core", default-features = false, features = ["mdns-astro"] }

# Its own on Windows.
[target.'cfg(windows)'.dependencies]
matter-peek-core = { version = "0.1.0", path = "../matter-peek-core", default-features = false, features = ["mdns-builtin"] }
