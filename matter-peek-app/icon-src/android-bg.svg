<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The background of Android's adaptive icon: the logo's tile, which the
       launcher cuts to its shape. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c4a7" />
      <stop offset="1" stop-color="#2f7cf6" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#tile)" />
</svg>
