[package]
name = "matter-peek-cli"
description = "The matter-peek command line: everything the web UI does, from a terminal; and as MCP tools, for AI agents"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "matter-peek"
path = "src/main.rs"

[dependencies]
# The API's messages.
matter-peek-core = { path = "../core" }
# Their connection: to a running server, or to a controller in this process.
matter-peek-server = { path = "../server" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = { workspace = true }
# Logs and OTA images travel base64-encoded.
base64 = "0.22"
log = { workspace = true }
env_logger = { workspace = true }
# `mcp`: async stdin/stdout, via a thread pool (the smol-family way).
blocking = "1"
futures-lite = { workspace = true }
# `chat`: the model's API over HTTP(S), and its Markdown in the terminal.
ureq = "3.5"
termimad = "0.35"
