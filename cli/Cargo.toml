[package]
name = "matter-peek-cli"
description = "The matter-peek command line: everything the web UI does, from a terminal"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "matter-peek"
path = "src/main.rs"

[dependencies]
matter-peek-proto = { path = "../proto" }
# The API: a connection to a running server, or to an actor in this process.
matter-peek-rpc = { path = "../rpc" }
clap = { version = "4", features = ["derive"] }
serde_json = { workspace = true }
# Logs and OTA images travel base64-encoded.
base64 = "0.22"
log = { workspace = true }
env_logger = { workspace = true }
