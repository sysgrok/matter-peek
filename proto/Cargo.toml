[package]
name = "matter-peek-proto"
description = "Wire contract (serde types) shared by the matter-peek RPC server and UIs"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true

[dependencies]
# `no_std` + `alloc`: serde's `alloc` feature covers internally-tagged enum
# deserialization (`#[serde(tag = ...)]`) and `String`/`Vec` without `std`, so
# this contract compiles for native, wasm32, and embedded alike.
serde = { workspace = true, features = ["derive", "alloc"] }
